# This workflow will install Python dependencies, run tests and lint with a variety of Python versions using tox
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Test Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.14 with Coverage
            os: ubuntu-latest
            python: '3.14'
            toxenv: py314-test-cov

          - name: Python 3.14
            os: ubuntu-latest
            python: '3.14'
            toxenv: py314-test

          - name: Python 3.13 with Coverage
            os: ubuntu-latest
            python: '3.13'
            toxenv: py313-test-cov

          - name: Python 3.13
            os: ubuntu-latest
            python: '3.13'
            toxenv: py313-test


    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}

    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox

    - name: Run tox
      run: |
        tox ${{ matrix.toxargs }} -e ${{ matrix.toxenv }} -- ${{ matrix.toxposargs }}
      env:
        # Set environment variable to indicate running in CI
        CI: true
